# 2. Installed Gems
plugins:
- jekyll-sitemap
- jekyll-mentions
- jekyll-seo-tag
- jemoji

# 4. Jekyll settings
sass:
  style: compressed # Style compression
permalink: pretty  # Pages are served as /page-name/
exclude: # Files in the repo that should not be published to the site
  - README.md
  - REVIEW.md
  - templates
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor


# 6. Jekyll collections settings
collections:
  research: # One Markdown file per project in _research/ (see templates/research-project.md)
    output: true
    permalink: /research/:name/

defaults:
  -
    scope:
      path: ""
      type: "research"
    values:
      layout: research
      feature_image: "/assets/images/feature/earth.jpg"
  -
    scope:
      path: ""
    values:
      image:  # Default image for sharing
  -
    scope:
      path: ""
      type: "pages"
    values:
      layout: page # Set the default layout for pages

# 7. Site settings
encoding: utf-8 # Make sure the encoding is right

title: "Davenport Research Group" # Site name or title, also used in jekyll-seo-tag
author: "Frances Davenport"
logo: "/assets/images/logo/cloud-computing-svgrepo-com.svg"
description: "The Davenport Research Group at Colorado State University studies global climate, the hydrologic cycle, and extreme climate events." # Site description and default description, also used in jekyll-seo-tag
url: "https://fdavenport.github.io" # Site url, also used in jekyll-seo-tag
baseurl: ""
repo: ""
email: ""
css_inline: true # Will insert all styles into a single <style> block in the <head> element and remove the style <link> reference

primarycolor:
secondarycolor:

# 9. Site navigation
navigation_header:
- title: About
  url: /
- title: People
  url: /people/
- title: Research
  url: /research/
- title: Publications
  url: /publications/
- title: Code
  url: /code/
- title: Opportunities
  url: /opportunities/

# Load custom fonts from fonts.google.com etc
#
# TIP: Try to keep the number of urls as low to reduce the performance cost
#      If multiple fonts can be requested in a single url opt for this
fonts:
  preconnect_urls:
    - https://fonts.gstatic.com
  font_urls:
    - https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,700&display=swap
