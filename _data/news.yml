# Group news. The home page shows the 5 newest items; the News page (/news/)
# shows everything, grouped by year. Items are sorted by date, so order here
# doesn't matter, but putting new items at the top keeps the file easy to read.
#
# To add an item, copy this block to the top of the list and edit it:
#
# - date: 2026-01-31              # YYYY-MM-DD; only the month and year are shown
#   text: |
#     What happened. You can use **bold**, *italics*, and [links](/people/).
#   image: /assets/images/news/photo-name.jpg        # optional
#   image_alt: Describe the photo for screen readers  # needed if you add an image
#
# Keep the two-space indents and the "|" after "text:"; with those, the text can
# contain any characters without needing quotes.

- date: 2025-12-15
  text: |
    Our group attended the AGU fall meeting in New Orleans in December. Nicole presented her research on geospatial attributes of global flood disasters, and  Mike presented his research on improving LSTM streamflow models for predicting high-flow events.
  image: /assets/images/news/keeney_agu2025.jpg
  image_alt: Nicole presenting at AGU

- date: 2025-10-16
  text: |
    Nicole Keeney successfully defended her MS thesis, *A spatially and temporally disaggregated twenty first century global flood record for flood impact analysis*. Congratulations, Nicole!

